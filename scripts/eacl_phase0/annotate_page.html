<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EACL 주석 · __AXIS__</title>
<style>
:root{--bg:#f7f7f5;--paper:#fff;--ink:#181818;--sub:#777;--line:#deded9;--accent:#315c4c;--soft:#f0f1ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.65}.shell{max-width:760px;margin:auto;padding:0 20px 140px}.top{position:sticky;top:0;z-index:20;background:#f7f7f5f2;backdrop-filter:blur(12px);padding:16px 0 12px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--sub)}.title{font-size:25px;font-weight:750;letter-spacing:-.025em}.rule{color:var(--sub);font-size:14px}.progress{height:3px;background:#ddd;margin-top:12px}.progress i{display:block;height:100%;background:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-top:5px}.main{padding-top:22px}.flow{display:grid;gap:10px}.sentence{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px}.sentence.now{border-left:4px solid var(--accent)}.tag{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--sub);margin-bottom:9px}.korean{font-size:22px;line-height:1.65;font-weight:600;letter-spacing:-.015em}.english{margin-top:14px;padding-top:11px;border-top:1px solid #eee;font-family:Georgia,serif;font-size:13px;line-height:1.55;color:#888}.down{text-align:center;color:#999;font-size:16px;height:18px;line-height:18px}.ai{margin-top:18px;background:var(--paper);border:1px solid var(--line);border-radius:10px}.ai-head{padding:14px 18px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}.ai-label{font-weight:750}.verdict{margin-left:auto;font-size:15px;font-weight:800;color:var(--accent)}.conf{font-size:12px;color:var(--sub)}.ai-body{padding:17px 18px}.small-title{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--sub);margin-bottom:5px}.why{font-size:17px;font-weight:550}.evidence-wrap{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}.evidence{font-family:Georgia,serif;font-size:12px;line-height:1.5;color:#888}.decision{position:sticky;bottom:8px;z-index:15;margin-top:18px;background:#fffffff2;backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;padding:10px}.ask{text-align:center;font-size:13px;font-weight:700;margin-bottom:8px;color:var(--sub)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ans{border:1px solid var(--line);border-radius:7px;padding:15px;font-size:17px;font-weight:750;cursor:pointer;background:var(--soft);color:var(--ink)}.ans:hover,.ans.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.tools{margin-top:14px}.notes{width:100%;min-height:48px;resize:vertical;border:1px solid var(--line);border-radius:7px;padding:10px;font:14px inherit;background:var(--paper)}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.nav button{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:9px;color:var(--sub);font-weight:650}.nav button:disabled{opacity:.3}.status{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:18px}.chip{font-size:11px;color:var(--sub);background:var(--paper);border:1px solid var(--line);padding:3px 8px;border-radius:20px}.chip.cur{border-color:var(--accent);color:var(--accent);font-weight:800}.chip.ok{background:var(--soft);color:var(--accent)}.done{text-align:center;background:var(--paper);padding:45px;border:1px solid var(--line);border-radius:10px}@media(max-width:640px){.shell{padding:0 10px 125px}.top{padding-top:10px}.title{font-size:21px}.main{padding-top:12px}.sentence{padding:18px 16px}.korean{font-size:19px}.english{font-size:12px}.why{font-size:16px}.decision{bottom:5px}.nav{grid-template-columns:1fr 1fr}}
</style></head><body><div class="shell"><header class="top"><div class="eyebrow">EACL · __AXIS__</div><div class="title">__TITLE__</div><div class="rule">__DEF__ <b>애매하면 변화 없음.</b></div><div class="progress"><i id="fill"></i></div><div class="meta"><span id="pos"></span><span id="cnt"></span></div></header><main id="app" class="main"></main><div class="status" id="status"></div></div>
<script>const AXIS="__AXIS__";let rows=[],idx=0,dirty=false;const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){rows=await(await fetch(`/api/rows?axis=${AXIS}`)).json();idx=rows.findIndex(x=>x.value===null);if(idx<0)idx=rows.length-1;render();loadStatus()}async function loadStatus(){const s=await(await fetch('/api/status')).json();status.innerHTML=s.order.map(a=>{const c=s.counts[a],ok=c.total&&c.filled===c.total;return `<span class="chip ${a===AXIS?'cur':''} ${ok?'ok':''}">${a} ${c.filled}/${c.total}</span>`}).join('')}function render(){const total=rows.length,filled=rows.filter(x=>x.value!==null).length;fill.style.width=`${100*filled/total}%`;pos.textContent=`${idx+1} / ${total}`;cnt.textContent=`완료 ${filled}`;if(idx>=total){app.innerHTML=`<div class="done"><h2>검수 완료</h2><p>${filled}/${total} 저장됨</p></div>`;return}const r=rows[idx],s=r.silver;app.innerHTML=`<div class="flow"><section class="sentence"><div class="tag">이전 문장</div><div class="korean">${esc(r.previous_ko_reference)}</div><div class="english">${esc(r.previous)}</div></section><div class="down">↓</div><section class="sentence now"><div class="tag">현재 문장</div><div class="korean">${esc(r.current_ko_reference)}</div><div class="english">${esc(r.current)}</div></section></div>${s?`<section class="ai"><div class="ai-head"><span class="ai-label">Claude의 판단</span><span class="conf">확신 ${Math.round(s.confidence*100)}%</span><span class="verdict">${s.suggested_value?'변화 있음':'변화 없음'}</span></div><div class="ai-body"><div class="small-title">판단 이유</div><div class="why">${esc(s.explanation_ko||s.explanation)}</div><div class="evidence-wrap"><div class="small-title">영어 근거</div><div class="evidence">${esc(s.evidence)}</div></div></div></section>`:''}<section class="decision"><div class="ask">내 최종 판단</div><div class="buttons"><button class="ans ${r.value===0?'sel':''}" onclick="answer(0)">변화 없음</button><button class="ans ${r.value===1?'sel':''}" onclick="answer(1)">변화 있음</button></div></section><div class="tools"><textarea class="notes" id="notes" placeholder="메모 (선택)" oninput="dirty=true">${esc(r.notes||'')}</textarea><div class="nav"><button onclick="go(idx-1)" ${idx===0?'disabled':''}>← 이전</button><button onclick="answer(null)">미입력</button><button onclick="jump()">다음 미입력</button><button onclick="go(idx+1)" ${idx===total-1?'disabled':''}>다음 →</button></div></div>`}async function saveNotes(){const t=document.getElementById('notes');if(!t||!dirty)return;rows[idx].notes=t.value;dirty=false;await save(rows[idx].value)}async function save(v){const r=rows[idx];await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({axis:AXIS,doc_id:r.doc_id,transition:r.transition,value:v,notes:r.notes||''})})}async function answer(v){await saveNotes();rows[idx].value=v;await save(v);loadStatus();go(idx+1)}async function go(i){await saveNotes();idx=Math.max(0,Math.min(rows.length,i));render();scrollTo({top:0,behavior:'smooth'})}function jump(){const i=rows.findIndex(x=>x.value===null);go(i<0?rows.length:i)}document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='0')answer(0);if(e.key==='1')answer(1);if(e.key==='ArrowLeft')go(idx-1);if(e.key==='ArrowRight')go(idx+1)});load();</script></body></html>
